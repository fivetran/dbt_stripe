version: 1.10.3
under_the_hood:
  - Documents the `metadata` column in `stg_stripe__coupon`. The model already selects
    this column, but the documentation left it out.
  - Removes `livemode` from `stg_stripe__credit_note`. The package filters on `livemode`
    rather than passing it through to the model output.
  - Removes `invoice_item_id` from `stg_stripe__price_plan`. The source `price` table
    has this column, but the model does not select it.
